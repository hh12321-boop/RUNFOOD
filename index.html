<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta property="og:title" content="FoodRun" />
<meta property="og:description" content="Reto de comida para streamers. Juega en el navegador." />
<meta property="og:image" content="https://hh12321-boop.github.io/RUNFOOD/carteles/foodrun-cartel-principal-es.png" />
<title>FOOD RUN — Reto de comida para streamers</title>
<style>
:root{--bg:#07090d;--panel:#10141c;--panel2:#161b26;--line:#232a38;--ink:#eef2f8;--mute:#8a94a8;
--acc:#00e5ff;--acc2:#b6ff3b;--warn:#ffb020;--bad:#ff3b5c;--gold:#ffd36b;
--mono:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;--sans:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(1200px 600px at 80% -10%,#0d2a33 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1a2410 0,transparent 60%),var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:50}
body.overlay{background:transparent}body.overlay::before{display:none}
body.chroma{background:#00b140}body.chroma::before{display:none}
button,input{font-family:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
.app{width:100%;min-height:100vh;padding:28px 40px;max-width:1920px;margin:0 auto}
.screen{display:none}.screen.active{display:block;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc)}
h1.logo{font-size:clamp(56px,7vw,120px);font-weight:900;letter-spacing:-.04em;line-height:.9;font-style:italic;text-transform:uppercase}
h1.logo span{color:var(--acc2);text-shadow:0 0 30px rgba(182,255,59,.35)}
.sub{color:var(--mute);font-size:18px;max-width:640px;margin-top:14px;line-height:1.5}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px;border:1px solid var(--line);background:var(--panel2);transition:.15s}
.btn:hover:not(:disabled){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 24px rgba(0,229,255,.2)}
.btn.primary{background:var(--acc2);color:#0a0d05;border-color:var(--acc2)}
.btn.primary:hover:not(:disabled){box-shadow:0 0 30px rgba(182,255,59,.45)}
.btn.cyan{background:var(--acc);color:#001318;border-color:var(--acc)}
.btn.danger{color:var(--bad);border-color:#4a1a24}
kbd{font-family:var(--mono);font-size:12px;padding:2px 7px;border:1px solid currentColor;border-radius:5px;opacity:.75}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.back{font-family:var(--mono);color:var(--mute);font-size:13px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:18px}
.back:hover{color:var(--acc)}
h2.title{font-size:44px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-style:italic}
.hint{color:var(--mute);margin:8px 0 20px;font-size:16px;line-height:1.5}
input.field{background:#0a0d13;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:16px;outline:none;min-width:0}
input.field:focus{border-color:var(--acc)}
/* menu */
.menu-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;margin-top:34px;align-items:start}
.modes{display:grid;gap:14px}
.mode{display:grid;grid-template-columns:72px 1fr auto;gap:18px;align-items:center;text-align:left;padding:22px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(100deg,var(--panel2),var(--panel));transition:.15s}
.mode:hover{border-color:var(--acc);transform:translateX(4px)}
.mode .ic{font-size:44px;width:72px;height:72px;display:grid;place-items:center;border-radius:12px;background:#0a0d13;border:1px solid var(--line)}
.mode h3{font-size:24px;text-transform:uppercase;font-weight:900;font-style:italic}
.mode p{color:var(--mute);margin-top:4px;line-height:1.4}
.mode .go{font-family:var(--mono);color:var(--acc)}
.lb table{width:100%;border-collapse:collapse;font-size:15px}
.lb th{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.lb td{padding:9px 6px;border-bottom:1px solid #161c27}
.lb td.n{font-family:var(--mono);color:var(--mute)}.lb tr:first-child td{color:var(--gold)}
.rk{font-weight:900;font-style:italic}
.rk-S{color:var(--gold)}.rk-A{color:var(--acc2)}.rk-B{color:var(--acc)}.rk-C{color:var(--mute)}.rk-F{color:var(--bad)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tg{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--mute)}
.tg.on{color:var(--acc);border-color:var(--acc)}
/* levels */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lvl{text-align:left;padding:22px;border-radius:14px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden;transition:.15s}
.lvl:hover:not(:disabled){border-color:var(--acc2)}
.lvl .num{font-size:64px;font-weight:900;font-style:italic;line-height:1;color:#1f2633}
.lvl h3{font-size:22px;text-transform:uppercase;margin-top:6px}
.lvl p{color:var(--mute);font-size:14px;margin-top:6px;line-height:1.4}
.lvl .meta{font-family:var(--mono);font-size:12px;color:var(--acc);margin-top:12px}
.lvl .pb{position:absolute;top:18px;right:18px;font-family:var(--mono);font-size:12px;color:var(--gold);text-align:right}
.diff{display:flex;gap:3px;margin-top:10px}.diff i{width:18px;height:4px;background:#232a38;border-radius:2px}.diff i.on{background:var(--bad)}
/* shop/pantry */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.shop{display:grid;gap:10px}
.si{display:grid;grid-template-columns:28px 56px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.si.got{border-color:var(--acc2);background:#121a0b}
.si input{width:20px;height:20px;accent-color:var(--acc2)}
.si .em{font-size:40px}.si h4{font-size:19px;text-transform:capitalize}.si small{color:var(--mute)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);border:1px solid #0e3a44;padding:4px 8px;border-radius:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:7px 11px;border-radius:7px;border:1px solid var(--line);color:var(--mute)}
.chip.on{color:#001318;background:var(--acc);border-color:var(--acc)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:52vh;overflow:auto;padding-right:4px}
.ft{padding:12px 6px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:center}
.ft .em{font-size:34px;display:block}.ft .nm{font-size:13px;color:var(--mute);margin-top:4px;display:block;text-transform:capitalize}
.ft.on{border-color:var(--acc2);background:#121a0b}.ft.on .nm{color:var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.tc{display:inline-flex;gap:6px;align-items:center;padding:6px 6px 6px 12px;border-radius:8px;background:#0a0d13;border:1px solid var(--line);text-transform:capitalize}
.tc button{color:var(--bad);font-weight:900;padding:0 6px}
/* briefing */
.brief{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.plates{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}
.plates span{font-size:72px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.kpi{background:#0a0d13;border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:34px;font-weight:900;font-family:var(--mono)}
.kpi small{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.code{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.08em;color:var(--acc2);padding:14px 18px;background:#0a0d13;border:1px dashed #3a4a1c;border-radius:10px;display:inline-block;user-select:all}
.steps-list{font-size:15px;color:var(--mute);line-height:1.7;max-height:46vh;overflow:auto;counter-reset:s;list-style:none}
.steps-list li{counter-increment:s;padding-left:38px;position:relative}
.steps-list li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;font-family:var(--mono);color:#3b4558}
.blur li{filter:blur(5px);user-select:none}
/* play */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.clock{font-family:var(--mono);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.02em;min-width:300px;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)}.clock.crit{color:var(--bad);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tbar{height:18px;background:#0a0d13;border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
.tbar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:background .3s}
.tbar.warn i{background:var(--warn)}.tbar.crit i{background:var(--bad);animation:blink .5s steps(2) infinite}
.hudr{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px;text-align:right}
.stat small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--mute)}
.stat b{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}
.stat.combo b{color:var(--acc2)}
.arena{display:grid;grid-template-columns:minmax(380px,0.8fr) 1.4fr;gap:28px;margin-top:24px;align-items:stretch}
.stage{position:relative;border-radius:16px;border:1px solid var(--line);background:radial-gradient(closest-side,#16202c 0,#0b0f16 70%);min-height:min(820px,74vh);display:grid;place-items:center;overflow:hidden}
.stage::after{content:"";position:absolute;left:50%;bottom:18%;width:62%;height:26px;margin-left:-31%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,229,255,.25),transparent);filter:blur(4px)}
.ring{position:absolute;width:380px;height:380px;border-radius:50%;border:1px solid #1d2a38;box-shadow:inset 0 0 60px rgba(0,229,255,.06)}
.ring svg{position:absolute;inset:-6px;width:392px;height:392px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bgc{stroke:transparent}.ring .fgc{stroke:var(--acc2);stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(182,255,59,.6))}
.food{font-size:210px;line-height:1;position:relative;z-index:2;transform-origin:50% 75%;filter:drop-shadow(0 30px 30px rgba(0,0,0,.65));will-change:transform}
.food.a-idle{animation:hover 3s ease-in-out infinite}
.food.a-bite{animation:bite .7s cubic-bezier(.3,1.6,.5,1)}
.food.a-chew{animation:chew .6s ease-in-out infinite}
.food.a-swallow{animation:swallow .9s cubic-bezier(.6,0,.4,1) forwards}
.food.a-dip{animation:dip 1.3s ease-in-out infinite}
.food.a-roll{animation:roll 1.4s cubic-bezier(.6,0,.4,1) infinite}
.food.a-chopstick{animation:pinch 1s ease-in-out infinite}
.food.a-hand{animation:lift 1.2s ease-in-out infinite}
.food.a-blow{animation:cool 1.1s ease-in-out infinite}
.food.a-drink{animation:tilt 1.6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes bite{0%{transform:scale(1)}35%{transform:scale(.82,1.12) rotate(-8deg)}65%{transform:scale(1.08,.92) rotate(4deg)}100%{transform:scale(1)}}
@keyframes chew{0%,100%{transform:scale(1,1)}25%{transform:scale(1.07,.93) rotate(-3deg)}50%{transform:scale(.95,1.05)}75%{transform:scale(1.05,.95) rotate(3deg)}}
@keyframes swallow{0%{transform:none;opacity:1}100%{transform:translateY(160px) scale(.15);opacity:0}}
@keyframes dip{0%,100%{transform:translateY(0) rotate(0)}45%,60%{transform:translateY(60px) rotate(14deg)}}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes pinch{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(.94)}}
@keyframes lift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(20px,-36px) rotate(-10deg)}}
@keyframes cool{0%,100%{transform:scale(1);filter:drop-shadow(0 30px 30px rgba(0,0,0,.65))}50%{transform:scale(.97);filter:drop-shadow(0 30px 30px rgba(0,0,0,.65)) brightness(.85) hue-rotate(-10deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-28deg) translateY(-20px)}}
.crumbs{position:absolute;inset:0;pointer-events:none;z-index:3}
.crumbs i{position:absolute;left:50%;top:45%;width:8px;height:8px;border-radius:2px;background:var(--gold);animation:crumb .7s ease-out forwards}
@keyframes crumb{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.steam{position:absolute;top:22%;left:50%;z-index:3;pointer-events:none}
.steam i{position:absolute;width:16px;height:60px;border-radius:50%;background:linear-gradient(transparent,rgba(255,255,255,.25),transparent);filter:blur(6px);animation:steam 2s ease-in infinite}
.steam i:nth-child(2){left:-40px;animation-delay:.6s}.steam i:nth-child(3){left:40px;animation-delay:1.2s}
@keyframes steam{0%{transform:translateY(20px) scaleX(.6);opacity:0}40%{opacity:1}100%{transform:translateY(-90px) scaleX(1.4);opacity:0}}
.glass{position:absolute;right:6%;bottom:8%;width:56px;height:78px;border:3px solid rgba(255,255,255,.35);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;z-index:3;display:none}
.glass i{position:absolute;left:0;right:0;bottom:0;height:80%;background:linear-gradient(var(--warn),#c76b00);transition:height 1.4s ease}
.stage.drink .glass{display:block}
.inst{display:flex;flex-direction:column;justify-content:space-between;padding:34px 38px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.inst .lbl{font-family:var(--mono);font-size:14px;letter-spacing:.3em;color:var(--acc)}
.inst h2{font-size:clamp(40px,4.2vw,76px);line-height:1.04;font-weight:900;letter-spacing:-.02em;margin-top:14px;text-wrap:balance}
.inst h2.swap{animation:swap .18s ease-out both}
.inst h2.long{font-size:clamp(32px,3.3vw,60px)}
.inst h2{overflow-wrap:anywhere;hyphens:auto}
@keyframes swap{from{opacity:1;transform:translateX(18px);text-shadow:0 0 24px rgba(0,229,255,.6)}to{opacity:1;transform:none;text-shadow:none}}
.inst .det{color:var(--mute);font-size:22px;margin-top:16px}
.lock{margin-top:24px;display:flex;align-items:center;gap:18px}
.lock .sec{font-family:var(--mono);font-size:64px;font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.lock .lt{font-family:var(--mono);color:var(--mute);letter-spacing:.15em;text-transform:uppercase;font-size:13px}
.next{border-top:1px solid var(--line);margin-top:26px;padding-top:18px;color:var(--mute);font-size:20px}
.next b{font-family:var(--mono);font-size:12px;letter-spacing:.25em;color:#55607a;display:block;margin-bottom:6px}
.done{margin-top:22px;width:100%;justify-content:center;font-size:26px;padding:22px;background:var(--acc2);color:#0a0d05;border-color:var(--acc2)}
.done:disabled{background:#1b2230;color:#55607a;border-color:var(--line);opacity:1}
.pips{display:flex;gap:4px;margin-top:18px}.pips i{flex:1;height:6px;background:#1b2230;border-radius:2px}.pips i.ok{background:var(--acc2)}.pips i.cur{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.toast{position:fixed;left:50%;top:82%;transform:translateX(-50%);font-size:44px;font-weight:900;font-style:italic;text-transform:uppercase;pointer-events:none;z-index:60;text-shadow:0 0 24px currentColor;opacity:0}
.toast.show{animation:toast .9s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.9)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
.count{position:fixed;inset:0;display:none;place-items:center;z-index:70;background:rgba(5,7,10,.82);backdrop-filter:blur(4px)}
.count.show{display:grid}
.count b{font-size:300px;font-weight:900;font-style:italic;color:var(--acc2);text-shadow:0 0 60px rgba(182,255,59,.5);animation:cnt 1s ease both}
@keyframes cnt{0%{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:55;box-shadow:inset 0 0 0 0 var(--bad);transition:box-shadow .2s}
.flash.on{box-shadow:inset 0 0 120px 10px rgba(255,59,92,.45)}
/* result */
.res{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:stretch}
.card{position:relative;min-height:min(860px,80vh);display:flex;flex-direction:column;justify-content:space-between;border-radius:18px;border:1px solid var(--line);padding:40px;background:linear-gradient(135deg,#0f1620,#0a0d13 60%);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(0,229,255,.06) 50%,transparent 60%)}
.card.win{border-color:#3a4a1c;box-shadow:0 0 0 1px #3a4a1c,0 0 60px rgba(182,255,59,.12)}
.card.fail{border-color:#4a1a24;box-shadow:0 0 0 1px #4a1a24,0 0 60px rgba(255,59,92,.14)}
.verdict{font-size:120px;font-weight:900;font-style:italic;line-height:.85;letter-spacing:-.04em;text-transform:uppercase}
.win .verdict{color:var(--acc2)}.fail .verdict{color:var(--bad)}
.grade{position:absolute;right:36px;top:30px;font-size:180px;font-weight:900;font-style:italic;line-height:1;opacity:.95}
.bigscore{font-family:var(--mono);font-size:84px;font-weight:800;margin-top:22px;font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.who{font-family:var(--mono);color:var(--mute);letter-spacing:.12em;margin-top:10px;text-transform:uppercase}
.pbadge{align-self:flex-start;display:inline-block;margin-top:14px;font-family:var(--mono);font-weight:800;letter-spacing:.2em;color:#0a0d05;background:var(--gold);padding:6px 12px;border-radius:6px}
.keys{font-family:var(--mono);font-size:12px;color:#55607a;margin-top:18px;letter-spacing:.08em}
.res>*,.arena>*,.brief>*,.two>*,.menu-grid>*{min-width:0}
body.chroma .hud,body.overlay .hud{background:rgba(7,9,13,.88);border-radius:12px;padding:10px 16px}
@media (max-width:1000px){.bigscore span{display:block;margin-top:6px}.lb{overflow-x:auto}.stage{min-height:300px!important}.ring{width:250px!important;height:250px!important}.ring svg{width:262px!important;height:262px!important}.food{font-size:120px!important}.inst{padding:22px}.inst h2{font-size:clamp(28px,7vw,44px)!important}.inst .det{font-size:17px}.lock .sec{font-size:56px}.next{font-size:16px}.bigscore{font-size:52px}.grade{font-size:110px;right:20px;top:16px}.card{padding:26px;min-height:0}.rgrid{grid-template-columns:repeat(2,1fr)}.hudr .stat{min-width:0}.app{padding:16px}h2.title{font-size:34px}.kpis{grid-template-columns:repeat(2,1fr)}.app{padding:18px}.menu-grid,.two,.brief,.arena,.res{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr}.hud{grid-template-columns:1fr}.clock{font-size:54px}.food{font-size:150px}.stage{min-height:360px}.ring{width:280px;height:280px}.ring svg{width:292px;height:292px}}
.intro{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(900px 500px at 50% 40%,#0d2a33 0,rgba(7,9,13,.96) 70%)}
.intro[hidden]{display:none}.intro{padding:24px}.intro .plates span{font-size:clamp(56px,8vw,110px);animation:hover 3s ease-in-out infinite}
body.overlay .intro,body.chroma .intro{background:rgba(7,9,13,.9)}
.inst.cue{animation:cue .7s ease}

/* ========== Utilidades ========== */
function $(id) { return document.getElementById(id); }
function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function foodById(id) { return FOODS.find(f => f.id === id); }
function nameOf(f) { return f.name; }
function the(f) { return (f.article ? f.article + " " : "") + f.name; }
function The(f) {
  const a = f.article || "";
  const cap = a ? a.charAt(0).toUpperCase() + a.slice(1) + " " : "";
  return cap + f.name;
}
function cultureName(key) { return CULTURES[key] || key || "casera"; }
function catName(key) { return CATS[key] || key || "otro"; }

function inferCustom(raw) {
  const name = raw.trim().replace(/\s+/g, " ");
  const n = name.toLowerCase();
  const drink = /zumo|jugo|agua|té|te |cafe|café|leche|vino|cerveza|refresco|batido|horchata|lassi|soda|infusión|infusion|cola|smoothie|kombucha|mate/.test(n);
  const fruit = /manzana|pera|plátano|platano|banana|naranja|uva|mango|sandía|sandia|kiwi|fresa|melón|melon|fruta|cereza|piña|pina|coco|ciruela/.test(n);
  const soup = /sopa|caldo|crema de|gazpacho|ramen|pho|miso|harira/.test(n);
  const dessert = /pastel|tarta|helado|gelato|chocolate|flan| natilla|galleta|brownie|donut|churro|mochi|tiramis|postre|cake/.test(n);
  let category = "principal";
  if (drink) category = "bebida";
  else if (fruit) category = "fruta";
  else if (soup) category = "sopa";
  else if (dessert) category = "postre";
  const hot = /sopa|caldo|café|cafe|té|te |curry|ramen|pho|estofado|guiso| sopa/.test(n);
  const chopsticks = /sushi|ramen|fideo|arroz frito|dumpling|gyoza|jiaozi|kimchi|pad thai|poke/.test(n);
  const emoji = drink ? "🥤" : fruit ? "🍎" : soup ? "🍲" : dessert ? "🍰" : "🍽️";
  const article = /as$|os$/.test(n) ? "los" : (/a$/.test(n) ? "la" : "el");
  return F("custom-" + n.replace(/\s+/g, "-"), name, article, emoji, "casera", category, chopsticks ? ["palillos"] : (drink ? ["vaso"] : ["manos"]), hot, { custom: true });
}

function resolveFood(text) {
  const q = text.trim().toLowerCase();
  if (!q) return null;
  let found = FOODS.find(f => f.name === q || f.id === q);
  if (found) return Object.assign({}, found);
  found = FOODS.find(f => f.name.toLowerCase() === q || (f.aliases || []).some(a => a.toLowerCase() === q));
  if (found) return Object.assign({}, found);
  found = FOODS.find(f => f.name.toLowerCase().includes(q) || q.includes(f.name.toLowerCase()) || (f.aliases || []).some(a => q.includes(a.toLowerCase()) || a.toLowerCase().includes(q)));
  if (found) return Object.assign({}, found);
  return inferCustom(text);
}

/* ========== Generador de instrucciones ========== */
function polishEs(s) {
  return String(s)
    .replace(/\bde el /g, "del ")
    .replace(/\ba el /g, "al ");
}

function step(text, detail, food, anim, duration, points) {
  return {
    text: polishEs(text),
    detail: polishEs(detail || ""),
    food: food || null,
    anim: anim || "idle",
    duration: duration || 0,
    points: points || 100
  };
}

function chewTime(level) {
  const c = LEVELS[level - 1].chew;
  return rand(c[0], c[1]);
}

function openingRitual(level, foods) {
  const steps = [];
  const first = foods[0];
  steps.push(step("¡Buen provecho! Siéntate con calma ante la mesa.", "El monitor te observa con una sonrisa.", first, "idle", 0, 80));
  if (level >= 2) {
    steps.push(step("Coloca la servilleta sobre las rodillas.", "Un gesto sencillo que ya parece de restaurante.", first, "idle", 0, 80));
  }
  if (level >= 3) {
    const cultures = [...new Set(foods.map(f => cultureName(f.culture)))];
    const via = cultures.length === 1
      ? "la cocina " + cultures[0]
      : "las cocinas " + cultures.slice(0, -1).join(", ") + " y " + cultures[cultures.length - 1];
    steps.push(step("Hoy viajamos por " + via + ".", "Respira el aroma antes de empezar.", first, first.hot ? "blow" : "idle", 0, 80));
  }
  if (level >= 5) {
    steps.push(step("Endereza la espalda y agradece el plato en silencio un momento.", "Sin prisa: comer también es un ritual.", first, "idle", 3, 90));
  }
  if (level >= 6) {
    steps.push(step("Mira el menú completo y decide el orden con el que lo vas a saborear.", "El monitor ya tiene el suyo, ¡síguelo al pie de la letra!", first, "idle", 0, 80));
  }
  return steps;
}

function utensilStep(food, ctx) {
  const u = (food.utensils || ["manos"])[0];
  if (u === "palillos") {
    if (ctx.chopsticks) return null;
    ctx.chopsticks = true;
    return step("Toma los palillos y sujétalos con pulgar, índice y corazón.", "La punta inferior casi no se mueve; la de arriba hace el trabajo.", food, "chopstick", 0, 110);
  }
  if (u === "tenedor") {
    return step("Coge el tenedor con la mano dominante y acércalo a " + the(food) + ".", "Sin clavar como si fuera un combate.", food, "idle", 0, 90);
  }
  if (u === "cuchara") {
    return step("Prepara la cuchara junto a " + the(food) + ".", "Cárgala con mesura, no a rebosar.", food, "idle", 0, 90);
  }
  return step("Coge " + the(food) + " con las manos, con cuidado y respeto.", "Los dedos también son cubiertos en muchas mesas.", food, "hand", 0, 90);
}

function foodCourse(food, level, ctx, opts) {
  opts = opts || {};
  const cfg = LEVELS[level - 1];
  const out = [];
  const rounds = Math.max(1, opts.rounds || 1);
  const includeUtensil = opts.includeUtensil !== false;
  const includePrep = opts.includePrep !== false;

  if (food.category === "bebida") {
    if (includePrep && food.hot && level >= 2) {
      out.push(step("Sopla un poco " + the(food) + " antes de acercarlo a los labios.", "El vapor avisa: no hace falta quemarse.", food, "blow", 3, 100));
    }
    if (includePrep && level >= 3 && food.hot) {
      out.push(step("Sujeta " + the(food) + " por el cuerpo de la taza o el vaso, sin quemarte.", "Acércalo a los labios con las dos manos si hace falta.", food, "drink", 0, 90));
    }
    const sips = food.sips || (level >= 4 ? 2 : 1);
    if (sips > 1) {
      out.push(step("Bebe " + sips + " sorbos pausados de " + the(food) + ".", "En algunas mesas, el té se honra a sorbos.", food, "drink", 0, 120));
    } else if (level >= 2 && opts.halfGlass) {

  }

  const u0 = (food.utensils || ["manos"])[0];
  if (includeUtensil && (opts.forceUtensil || cfg.utensils || u0 === "palillos")) {

    if (food.mix) out.push(step("Remueve " + the(food) + " para mezclar arroz, verdura y salsa.", "Que cada cucharada lleve un poco de todo.", food, "roll", 0, 110));
    if (food.wrap) out.push(step("Enrolla un trozo de " + food.name + " en " + food.wrap + ".", "Cierra con suavidad para que no se escape.", food, "roll", 0, 120));
    if (food.hot && (cfg.techniques || food.category === "sopa")) {
      out.push(step("Sopla un poco " + the(food) + ": llega caliente a la mesa.", "El vapor es aviso, no decoración.", food, "blow", 3, 100));
    }
  }

  for (let r = 0; r < rounds; r++) {
    if ((includePrep || r === 0) && (cfg.techniques || cfg.techniques === "light" || level >= 2)) {

      } else if (food.scoop && ctx.saucy && r === 0) {
        out.push(step("Haz con " + the(food) + " un cucharón y recoge un poco de " + the(ctx.saucy) + ".", "Dobla un poco el pan para que no gotee.", food, "dip", 0, 110));
      }
      if (food.roll && r === 0) {
        out.push(step("Enrolla " + the(food) + " en el tenedor con un giro limpio.", "Evita chapucear un nido descomunal.", food, "roll", 0, 120));
      }
      if (food.holdCareful && r === 0) {
        out.push(step("Sujeta " + the(food) + " con pulgar e índice para que no se desmonte.", "Inclina un poco la cabeza hacia el plato, no al revés.", food, "hand", 0, 110));
      }

      }
      if (food.sipBowl && r === 0) {
        out.push(step("Bebe un poco de caldo del cuenco de " + the(food) + ".", "Puedes alzar el cuenco con las dos manos.", food, "drink", 0, 110));
      }
      if (food.lick && r === 0) {

      }

      }

    if (food.oneBite) {
      out.push(step("Lleva " + the(food) + " a la boca de un solo bocado, si puedes.", "En el sushi, partirlo a medias es de mal tono.", food, "bite", 0, 120));
    } else if (food.category === "sopa") {
      out.push(step("Toma una cucharada de " + the(food) + ".", "Sopla si aún quema.", food, food.hot ? "blow" : "idle", 0, 100));
    } else {
      const bites = r === 0 ? (level === 1 ? 2 : rand(2, Math.min(3, 1 + level))) : rand(1, 2);
      const vez = bites === 1 ? "una vez" : (bites + " veces");

    if (food.pit && r === 0) {

    }

    out.push(step("Traga " + the(food) + " con calma.", "Un sorbo de aire después no viene mal.", food, "swallow", 0, 100));
  }
  return out;
}

function isCoreStep(s) {
  return /¡Buen provecho|Empuja un poco el plato|Traga |Bebe |Sorbe |Mastica |Muerde |Lleva .+ a la boca|Toma una cucharada/.test(s.text);
}

function dropOptional(steps, maxS) {
  const out = steps.slice();
  for (let i = out.length - 2; i > 0 && out.length > maxS; i--) {
    if (!isCoreStep(out[i])) out.splice(i, 1);
  }
  if (out.length > maxS) {
    const chewSeen = new Set();
    const kept = [];
    for (let i = 0; i < out.length; i++) {
      const s = out[i];
      const foodId = s.food && s.food.id;
      if (/Mastica /.test(s.text) && foodId) {
        if (chewSeen.has(foodId) && (kept.length + (out.length - i) - 1 >= maxS)) {
          // drop extra chew only if we can also drop following swallow? keep swallows.
          continue;
        }
        chewSeen.add(foodId);
      }
      kept.push(s);
    }
    // If still long, drop extra (2nd+) chew+ maybe we over-dropped; fallback keep first maxS but always first+last
    if (kept.length > maxS) {
      const mid = kept.slice(1, -1);
      const need = maxS - 2;
      // prefer keeping core steps in order
      const core = mid.filter(isCoreStep);
      const rest = mid.filter(s => !isCoreStep(s));
      const chosen = (core.length >= need ? core.slice(0, need) : core.concat(rest.slice(0, need - core.length)));
      return [kept[0]].concat(chosen, [kept[kept.length - 1]]);
    }
    return kept;
  }
  return out;
}

function padSteps(steps, minS, level, food) {
  const out = steps.slice();
  const extras = () => {
    const t = chewTime(level);
    return [
      step("Toma un bocado extra de " + the(food) + ".", "Aún queda algo en el plato.", food, "bite", 0, 90),
      step("Mastica un poco más: " + t + " segundos.", "La prisa no aporta sabor.", food, "chew", t, 110),
      step("Traga y sonríe al monitor.", "Vas por buen camino.", food, "swallow", 0, 80)
    ];
  };
  let k = 0;
  const pack = extras();
  while (out.length < minS) {
    out.splice(Math.max(1, out.length - 1), 0, pack[k % pack.length]);
    k++;
    if (k % pack.length === 0) pack.push(...extras());
  }
  return out;
}


function closingRitual(level, foods) {
  const last = foods[foods.length - 1];
  const steps = [];
  if (level >= 2) steps.push(step("Pasa la servilleta por los labios, sin frotar de más.", "La mesa queda tan limpia como al empezar.", last, "idle", 0, 80));
  if (level >= 4) steps.push(step("Bebe un último trago de agua o de lo que quede en el vaso.", "Cierra el sabor con algo fresco.", foods.find(f => f.category === "bebida") || last, "drink", 0, 90));
  if (level >= 6) steps.push(step("Agradece en voz alta: «Gracias por la comida».", "En japonés sería itadakimashita; en cualquier idioma, queda bien.", last, "idle", 0, 90));
  steps.push(step("Empuja un poco el plato hacia el centro: has terminado.", "El monitor aplaude con los cubiertos (suavemente).", last, "idle", 0, 80));
  return steps;
}

function generateInstructions(foods, level) {
  const cfg = LEVELS[level - 1];
  const [minS, maxS] = cfg.steps;
  const drinks = foods.filter(f => f.category === "bebida");
  const solids = foods.filter(f => f.category !== "bebida");
  const bread = foods.find(f => f.scoop || f.id === "naan" || f.id === "pan" || f.id === "pita" || f.id === "khobz") || null;
  const saucy = foods.find(f => f.breadDip || f.category === "sopa" || ["curry","hummus","guacamole","cuscus","biryani"].includes(f.id)) || null;

  function build(rounds, prep, utensilsOn, ritualLevel) {
    const ctx = { drinks, drinkI: 0, chopsticks: false, bread, saucy };
    const opening = openingRitual(ritualLevel, foods);
    const closing = closingRitual(ritualLevel, foods);
    let steps = opening.slice();
    const mains = solids.length ? solids : foods.slice();
    mains.forEach((f, idx) => {
      if (f.category === "bebida") return;
      const r = f.oneBite ? 1 : rounds;
      steps = steps.concat(foodCourse(f, level, ctx, {
        rounds: r, includePrep: prep, includeUtensil: utensilsOn
      }));
      if (cfg.interleave && drinks.length && idx < mains.length) {
        const d = drinks[ctx.drinkI % drinks.length];
        ctx.drinkI++;
        steps.push(step("Bebe un sorbo de " + the(d) + " para limpiar el paladar.", "Alternar bocado y trago es de buena mesa.", d, "drink", 0, 100));
      }
    });
    if (drinks.length && ctx.drinkI === 0) {
      drinks.forEach((d, i) => {
        steps = steps.concat(foodCourse(d, level, ctx, {
          rounds: 1, includePrep: prep && i === 0, includeUtensil: false, halfGlass: level >= 2 && i === 0
        }));
      });
    } else if (drinks.length && cfg.techniques === "advanced") {
      const d = drinks[0];
      steps.push(step("Deja el plato un instante y brinda un último sorbo de " + the(d) + ".", "El contraste de sabores es parte del menú.", d, "drink", 0, 100));
    }
    return steps.concat(closing);
  }

  let rounds = Math.max(1, cfg.bites);
  let prep = true;
  let utensilsOn = !!cfg.utensils || foods.some(f => (f.utensils || []).includes("palillos"));
  let ritualLevel = level;
  let steps = build(rounds, prep, utensilsOn, ritualLevel);

  while (steps.length > maxS && rounds > 1) {
    rounds--;
    steps = build(rounds, prep, utensilsOn, ritualLevel);
  }
  if (steps.length > maxS && ritualLevel > 2) {
    ritualLevel = Math.max(2, ritualLevel - 2);
    steps = build(rounds, prep, utensilsOn, ritualLevel);
  }
  if (steps.length > maxS) {
    prep = false;
    steps = build(rounds, prep, utensilsOn, ritualLevel);
  }
  if (steps.length > maxS) {
    steps = dropOptional(steps, maxS);
  }
  if (steps.length < minS) {
    steps = padSteps(steps, minS, level, solids[0] || foods[0]);
  }
  return steps;
}

function chooseShopFoods(level) {

function starsFrom(score, max, perfects, early) {
  if (max <= 0) return 1;
  const ratio = score / max;
  let s = 1;
  if (ratio >= 0.7) s = 2;
  if (ratio >= 0.9 && early <= 1) s = 3;
  if (perfects >= 2 && ratio >= 0.92) s = 3;
  return s;
}

    if (food.unwrap) out.push(stepEn("Unwrap " + (food.unwrapEn || food.unwrap) + " from " + theEn(food) + ".", "The filling is what you eat.", food, "hand", 0, 110));
    if (food.pod) out.push(stepEn("Open an edamame pod and pop the beans out with your teeth or fingers.", "Do not eat the pod.", food, "pod" in food ? "hand" : "hand", 0, 110));
    if (food.slice) out.push(stepEn("Tear off a portion of " + theEn(food) + ".", "Not too big, not too tiny.", food, "bite", 0, 90));
    if (food.mix) out.push(stepEn("Stir " + theEn(food) + " to mix the rice, vegetables and sauce.", "Every spoonful should have a bit of everything.", food, "roll", 0, 110));
    if (food.wrap) out.push(stepEn("Wrap a piece of " + food.nameEn + " in " + (food.wrapEn || food.wrap) + ".", "Close it gently so nothing falls out.", food, "roll", 0, 120));
    if (food.hot && (cfg.techniques || food.category === "sopa")) {
      out.push(stepEn("Blow gently on " + theEn(food) + ": it arrives hot.", "Steam is a warning, not decoration.", food, "blow", 3, 100));
    }
  }

  for (let r = 0; r < rounds; r++) {
    if ((includePrep || r === 0) && (cfg.techniques || cfg.techniques === "light" || level >= 2)) {
      if (food.dip && r === 0) {
        out.push(stepEn("Dip " + theEn(food) + " in " + (food.dipEn || food.dip) + ", just the edge.", "No puddles: a hint of flavor, not a flood.", food, "dip", 0, 110));
      } else if (food.soy && r === 0) {
        out.push(stepEn("Lightly dip the edge of " + theEn(food) + " in soy sauce without soaking the rice.", "Fish side in the soy, rice side out.", food, "dip", 0, 120));
      } else if (food.breadDip && ctx.bread && r === 0) {
        out.push(stepEn("Use " + theEn(ctx.bread) + " to scoop up some of " + theEn(food) + ".", "Bread is the spoon at this table.", food, "dip", 0, 120));
      } else if (food.scoop && ctx.saucy && r === 0) {
        out.push(stepEn("Fold " + theEn(food) + " into a scoop and pick up some of " + theEn(ctx.saucy) + ".", "Fold the bread slightly so it does not drip.", food, "dip", 0, 110));
      }
      if (food.roll && r === 0) {
        out.push(stepEn("Twirl " + theEn(food) + " around your fork in one clean turn.", "Avoid making a giant nest.", food, "roll", 0, 120));
      }
      if (food.holdCareful && r === 0) {
        out.push(stepEn("Hold " + theEn(food) + " between thumb and index finger so it does not fall apart.", "Lean your head toward the plate, not the other way round.", food, "hand", 0, 110));
      }
      if (food.slurp && r === 0 && cfg.techniques) {
        out.push(stepEn("Slurp " + theEn(food) + " boldly: in this cuisine slurping is a compliment.", "Air and broth together, no fear.", food, "drink", 0, 120));
      }
      if (food.sipBowl && r === 0) {
        out.push(stepEn("Sip some broth from the bowl of " + theEn(food) + ".", "You can lift the bowl with both hands.", food, "drink", 0, 110));
      }
      if (food.lick && r === 0) {
        out.push(stepEn("Lick " + theEn(food) + " before biting so it does not drip.", "A classic ice cream move.", food, "bite", 0, 90));
      }
      if (food.crunch && r === 0) {
        out.push(stepEn("Snap off a crunchy piece of " + theEn(food) + " and listen to the crunch.", "That texture is half the dish.", food, "bite", 0, 100));
      }
    }

    if (food.oneBite) {
      out.push(stepEn("Put " + theEn(food) + " in your mouth in a single bite, if you can.", "Biting sushi in half is bad manners.", food, "bite", 0, 120));
    } else if (food.category === "sopa") {
      out.push(stepEn("Take a spoonful of " + theEn(food) + ".", "Blow on it if it is still hot.", food, food.hot ? "blow" : "idle", 0, 100));
    } else {
      const bites = r === 0 ? (level === 1 ? 2 : rand(2, Math.min(3, 1 + level))) : rand(1, 2);
      const vez = bites === 1 ? "a bite" : (bites + " bites");
      out.push(stepEn("Take " + vez + " of " + theEn(food) + ".", "Clean bites, no rush.", food, "bite", 0, 110));
    }

    const t = food.carefulChew ? Math.max(chewTimeEn(level), 10) : chewTimeEn(level);
    const chewDetail = food.carefulChew
      ? "Mochi needs real chewing: do not swallow it whole."
      : "Count the seconds. The host will not rush the plate.";
    out.push(stepEn("Chew " + theEn(food) + " for " + t + " seconds.", chewDetail, food, "chew", t, 130));

    if (food.pit && r === 0) {
      out.push(stepEn("Remove the pit from " + theEn(food) + " discreetly and leave it on the plate.", "No wild spitting.", food, "idle", 0, 100));
    }

    out.push(stepEn("Swallow " + theEn(food) + " calmly.", "A breath afterwards helps.", food, "swallow", 0, 100));
  }
  return out;
}

function isCoreStepEn(s) {
  return /Enjoy your meal|Push the plate|Swallow |Take (a sip|\d+ slow sips|a spoonful|a bite|\d+ bites|a last sip)|Drink |Sip some|Slurp |Chew |Put .+ in your mouth/.test(s.text);
}

function dropOptionalEn(steps, maxS) {
  const out = steps.slice();
  for (let i = out.length - 2; i > 0 && out.length > maxS; i--) {
    if (!isCoreStepEn(out[i])) out.splice(i, 1);
  }
  if (out.length > maxS) {
    const chewSeen = new Set();
    const kept = [];
    for (let i = 0; i < out.length; i++) {
      const s = out[i];
      const foodId = s.food && s.food.id;
      if (/Chew /.test(s.text) && foodId) {
        if (chewSeen.has(foodId) && (kept.length + (out.length - i) - 1 >= maxS)) {
          // drop extra chew only if we can also drop following swallow? keep swallows.
          continue;
        }
        chewSeen.add(foodId);
      }
      kept.push(s);
    }
    // If still long, drop extra (2nd+) chew+ maybe we over-dropped; fallback keep first maxS but always first+last
    if (kept.length > maxS) {
      const mid = kept.slice(1, -1);
      const need = maxS - 2;
      // prefer keeping core steps in order
      const core = mid.filter(isCoreStepEn);
      const rest = mid.filter(s => !isCoreStepEn(s));
      const chosen = (core.length >= need ? core.slice(0, need) : core.concat(rest.slice(0, need - core.length)));
      return [kept[0]].concat(chosen, [kept[kept.length - 1]]);
    }
    return kept;
  }
  return out;
}

function padStepsEn(steps, minS, level, food) {
  const out = steps.slice();
  const extras = () => {
    const t = chewTimeEn(level);
    return [
      stepEn("Take one more bite of " + theEn(food) + ".", "There is still some left on the plate.", food, "bite", 0, 90),
      stepEn("Chew a little longer: " + t + " seconds.", "Rushing adds no flavor.", food, "chew", t, 110),
      stepEn("Swallow and smile at the host.", "You are doing great.", food, "swallow", 0, 80)
    ];
  };
  let k = 0;
  const pack = extras();
  while (out.length < minS) {
    out.splice(Math.max(1, out.length - 1), 0, pack[k % pack.length]);
    k++;
    if (k % pack.length === 0) pack.push(...extras());
  }
  return out;
}


function closingRitualEn(level, foods) {
  const last = foods[foods.length - 1];
  const steps = [];
  if (level >= 2) steps.push(stepEn("Dab your lips with the napkin, no scrubbing.", "The table is as clean as when you started.", last, "idle", 0, 80));
  if (level >= 4) steps.push(stepEn("Take a last sip of water or whatever is left in your glass.", "Finish the flavor with something fresh.", foods.find(f => f.category === "bebida") || last, "drink", 0, 90));
  if (level >= 6) steps.push(stepEn("Say it out loud: Thanks for the meal!", "In Japanese it would be gochisousama; in any language it is a nice touch.", last, "idle", 0, 90));
  steps.push(stepEn("Push the plate slightly toward the center: you are done.", "The host applauds with the cutlery (gently).", last, "idle", 0, 80));
  return steps;
}

function generateInstructionsEn(foods, level) {
  const cfg = LEVELS[level - 1];
  const [minS, maxS] = cfg.steps;
  const drinks = foods.filter(f => f.category === "bebida");
  const solids = foods.filter(f => f.category !== "bebida");
  const bread = foods.find(f => f.scoop || f.id === "naan" || f.id === "pan" || f.id === "pita" || f.id === "khobz") || null;
  const saucy = foods.find(f => f.breadDip || f.category === "sopa" || ["curry","hummus","guacamole","cuscus","biryani"].includes(f.id)) || null;

  function build(rounds, prep, utensilsOn, ritualLevel) {
    const ctx = { drinks, drinkI: 0, chopsticks: false, bread, saucy };
    const opening = openingRitualEn(ritualLevel, foods);
    const closing = closingRitualEn(ritualLevel, foods);
    let steps = opening.slice();
    const mains = solids.length ? solids : foods.slice();
    mains.forEach((f, idx) => {
      if (f.category === "bebida") return;
      const r = f.oneBite ? 1 : rounds;
      steps = steps.concat(foodCourseEn(f, level, ctx, {
        rounds: r, includePrep: prep, includeUtensil: utensilsOn
      }));
      if (cfg.interleave && drinks.length && idx < mains.length) {
        const d = drinks[ctx.drinkI % drinks.length];
        ctx.drinkI++;
        steps.push(stepEn("Take a sip of " + theEn(d) + " to cleanse your palate.", "Alternating bites and sips is good table manners.", d, "drink", 0, 100));
      }
    });
    if (drinks.length && ctx.drinkI === 0) {
      drinks.forEach((d, i) => {
        steps = steps.concat(foodCourseEn(d, level, ctx, {
          rounds: 1, includePrep: prep && i === 0, includeUtensil: false, halfGlass: level >= 2 && i === 0
        }));
      });
    } else if (drinks.length && cfg.techniques === "advanced") {
      const d = drinks[0];
      steps.push(stepEn("Set the plate aside for a moment and toast with a last sip of " + theEn(d) + ".", "The contrast of flavors is part of the menu.", d, "drink", 0, 100));
    }
    return steps.concat(closing);
  }

  let rounds = Math.max(1, cfg.bites);
  let prep = true;
  let utensilsOn = !!cfg.utensils || foods.some(f => (f.utensils || []).includes("palillos"));
  let ritualLevel = level;
  let steps = build(rounds, prep, utensilsOn, ritualLevel);

  while (steps.length > maxS && rounds > 1) {
    rounds--;
    steps = build(rounds, prep, utensilsOn, ritualLevel);
  }
  if (steps.length > maxS && ritualLevel > 2) {
    ritualLevel = Math.max(2, ritualLevel - 2);
    steps = build(rounds, prep, utensilsOn, ritualLevel);
  }
  if (steps.length > maxS) {
    prep = false;
    steps = build(rounds, prep, utensilsOn, ritualLevel);
  }
  if (steps.length > maxS) {
    steps = dropOptionalEn(steps, maxS);
  }
  if (steps.length < minS) {
    steps = padStepsEn(steps, minS, level, solids[0] || foods[0]);
  }
  return steps;
}

/* ========== Reto: configuración ========== */
const STORE = "foodrun.v2";
const SPEED = [1.25, 1.15, 1, 0.9, 0.8, 0.7];   // multiplicador de duración de pasos sin tiempo fijo
const INTRO = 6;
const BASE = { bite: 3, swallow: 2, drink: 4, dip: 3.5, roll: 3.5, chopstick: 3.5, hand: 3, blow: 3, chew: 8, idle: 3 };
function stepSecs(s, level) {
  if (s.duration > 0) return s.duration;
  let b = BASE[s.anim] || 3;
  if (/^Bebe \d+ sorbos|medio vaso/.test(s.text)) b += 1.5;
  b = Math.max(b, Math.min(6, s.text.length / 16));
  return Math.round(Math.max(1.8, b * SPEED[level - 1]) * 2) / 2;
}

const S = { mode: "shop", level: 1, seed: "", foods: [], steps: [], code: "", picked: [], filter: "todos", q: "",
  checks: {}, running: false, i: 0, limit: 0, t0: 0, raf: 0, stepT0: 0, unlockAt: 0, score: 0, combo: 0, maxCombo: 0,
  pen: 0, fast: 0, muted: false, result: null, warned: 0 };

function db() { try { return Object.assign({ name: "", board: [], pb: {}, unlocked: { shop: 1, pantry: 1 }, overlay: "" }, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) { return { name: "", board: [], pb: {}, unlocked: { shop: 1, pantry: 1 }, overlay: "" }; } }
function save(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) {} }

/* RNG con semilla para que todos jueguen el mismo reto */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed, fn) { const orig = Math.random; Math.random = mulberry(hash(seed)); try { return fn(); } finally { Math.random = orig; } }
function newSeed() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }

function makeCode() {
  let c = "FR-" + (S.mode === "shop" ? "C" : "D") + S.level + "-" + S.seed;
  if (S.mode === "pantry") c += "-" + S.foods.map(f => f.custom ? "~" + encodeURIComponent(f.name).replace(/-/g, "%2D") : f.id).join(".");
  return c;
}
function parseCode(raw) {
  const m = String(raw).trim().match(/^FR-([CD])([1-6])-([A-Z0-9]{3,8})(?:-(.+))?$/i);
  if (!m) return null;
  const mode = m[1].toUpperCase() === "C" ? "shop" : "pantry";
  let foods = null;
  if (mode === "pantry") {
    if (!m[4]) return null;
    foods = m[4].split(".").map(x => x.startsWith("~") ? resolveFood(decodeURIComponent(x.slice(1))) : (foodById(x) ? Object.assign({}, foodById(x)) : null)).filter(Boolean);
    if (!foods.length) return null;
  }
  return { mode, level: +m[2], seed: m[3].toUpperCase(), foods };
}
function buildChallenge() {
  const key = S.seed + "|" + S.level + "|" + S.mode; let chose = false;
  seeded(key, () => {
    if (S.mode === "shop" && !S.foods.length) { S.foods = chooseShopFoods(S.level); chose = true; }
    S.stepsEs = generateInstructions(S.foods, S.level);
  });
  seeded(key, () => { if (chose) chooseShopFoods(S.level); S.stepsEn = generateInstructionsEn(S.foods, S.level); });
  S.stepsEs.forEach(s => { s.secs = stepSecs(s, S.level); });
  if (S.stepsEn.length === S.stepsEs.length) S.stepsEn.forEach((s, i) => { s.secs = S.stepsEs[i].secs; }); else S.stepsEn = null;
  S.steps = LANG === "en" && S.stepsEn ? S.stepsEn : S.stepsEs;
  S.limit = INTRO + 4 + S.steps.reduce((a, s) => a + s.secs, 0);
  S.code = makeCode();
}

let UI_RX = null;

  Object.keys(CATS).forEach(k => pairs.push([CATS[k], CAT_EN[k]]));
  pairs.sort((a, b) => b[0].length - a[0].length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  UI_RX = pairs.map(([es, en]) => [new RegExp("(^|[^\\p{L}])" + esc(es) + "(?![\\p{L}])", "gu"), en]);

  if (root.nodeType !== 1) return;

  while ((n = w.nextNode())) if (!skip(n) && /\p{L}/u.test(n.nodeValue)) { const t = trText(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
  root.querySelectorAll && root.querySelectorAll("[placeholder],[title]").forEach(e => { ["placeholder", "title"].forEach(a => { if (e.hasAttribute(a)) { const t = trText(e.getAttribute(a)); if (t !== e.getAttribute(a)) e.setAttribute(a, t); } }); });
}

  d.pb[S.mode + S.level] = { done: true };
  d.board.unshift({ name, time: S.limit, level: S.level, code: S.code, date: Date.now() }); d.board = d.board.slice(0, 50);
  if (S.level >= (d.unlocked[S.mode] || 1)) d.unlocked[S.mode] = Math.min(6, S.level + 1);
  save(d); musicStop(); sfx.win(); say(L("¡Reto completado!", "Challenge complete!"));
  $("s-result").innerHTML = `<div class="res">
  <div class="card win"><div class="kicker">FoodRun · Nivel ${S.level} · ${escapeHtml(LEVELS[S.level - 1].name)}</div>
    <div class="verdict" style="margin-top:18px">Reto<br>completado</div>
    <div class="who">${escapeHtml(name)} · ${new Date().toLocaleDateString(LANG === "en" ? "en-GB" : "es-ES")}</div>
    <div class="bigscore">${fmt(S.limit).slice(0, 5)} <span style="font-size:24px;color:var(--mute)">DURACIÓN TOTAL</span></div>
    <div class="rgrid"><div class="kpi"><b>${S.steps.length}</b><small>pasos</small></div><div class="kpi"><b>${S.foods.length}</b><small>alimentos</small></div>
      <div class="kpi"><b>${S.steps.filter(s => /Mastica|Chew/.test(s.text)).length}</b><small>masticados</small></div><div class="kpi"><b>${new Set(S.foods.map(f => f.culture)).size}</b><small>cocinas</small></div></div>
    <div class="row" style="justify-content:space-between"><span class="plates" style="margin:0">${S.foods.map(f => `<span style="font-size:44px">${f.emoji}</span>`).join("")}</span>
    <span class="code" style="font-size:24px">${escapeHtml(S.code)}</span></div></div>
  <div class="panel lb"><div class="kicker">¿Quién se atreve? Usa este código</div><div class="code" style="margin:14px 0 22px;font-size:40px">${escapeHtml(S.code)}</div>
    <div class="kicker">Historial de retos</div><div style="margin-top:10px">${boardTable(d.board, 8)}</div>
    <div class="row" style="margin-top:20px"><button class="btn primary" id="r-again">Repetir <kbd>R</kbd></button>
      ${S.level < 6 ? `<button class="btn cyan" id="r-next">Siguiente nivel</button>` : ""}
      <button class="btn" id="r-copy">Copiar código</button><button class="btn" id="r-menu">Menú</button></div></div></div>`;
  $("r-again").onclick = () => launch(false);
  if ($("r-next")) $("r-next").onclick = () => { S.level++; S.seed = newSeed(); if (S.mode === "shop") { S.foods = []; renderShop(); } else { buildChallenge(); renderBrief(false); } };
  $("r-copy").onclick = () => { try { navigator.clipboard.writeText(S.code); $("r-copy").textContent = "Copiado"; } catch (e) {} };
  $("r-menu").onclick = renderMenu;
  show("s-result");
}

/* ========== Teclado (solo preparación y emergencia) ========== */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const cur = document.querySelector(".screen.active").id;
  if ((e.code === "Space" || e.key === " ") && cur === "s-brief") { e.preventDefault(); launch(false); }
  else if ((e.key === "p" || e.key === "P") && cur === "s-play") togglePause();
  else if (e.key === "Escape" && cur === "s-play") abandon();
  else if ((e.key === "r" || e.key === "R") && cur === "s-result") launch(false);
  else if (e.key === "m" || e.key === "M") { S.muted = !S.muted; applyVolumes(); if (S.muted) try { speechSynthesis.cancel(); } catch (x) {} toast(S.muted ? "Silencio" : "Sonido", "var(--acc)"); }
});

/* ========== Arranque (+ ganchos demo para capturas/pruebas) ========== */
function init() {
  const d = db(), q = new URLSearchParams(location.search);
  setLang(q.get("lang") || d.lang || ((navigator.language || "es").startsWith("es") ? "es" : "en"));
  applyOverlay(q.get("overlay") || d.overlay);
  renderMenu();
  const demo = q.get("demo");
  if (!demo || demo === "menu") return;
  if (q.get("name")) { d.name = q.get("name"); save(d); }
  if (q.get("voz") === "0") { d.voice = false; save(d); }
  S.mode = "shop"; S.level = +(q.get("nivel") || 4); S.seed = q.get("seed") || "K7QXM";
  S.foods = (q.get("comidas") || "ramen,gyoza,teverde").split(",").map(x => foodById(x) ? Object.assign({}, foodById(x)) : resolveFood(x));
  buildChallenge();
  if (demo === "brief") return renderBrief(true);
  launch(false);
  const at = +(q.get("at") || 0);
  if (demo === "end") S.t0 -= (S.limit + 1) * 1000; else if (at) S.t0 -= at * 1000;
  tick();
}
init();
</script>
